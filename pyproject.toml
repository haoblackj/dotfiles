[tool.pytest.ini_options]
# 設定の門（penguinEx issue #16、テスト基盤の層3）。追加の依存はゼロ。
#
# **`strict` は pytest 9 の機能。**strict_config・strict_markers・
# strict_xfail・strict_parametrization_ids を一度に有効にする。
# **`minversion` と対で置く。**pytest 8 以下では未知の ini として警告だけ
# 出て黙って無効になるため、バージョンの床が無いと門が消える。
minversion = "9"
strict = true

testpaths = ["dot_claude/hooks/tests"]

# **`pythonpath` は置かない。**このリポジトリのテスト2本はどちらも
# importlib.util で対象を自前に読み込んでおり、素の兄弟 import に
# 依存していない（penguinEx 側とはここが違う）。

log_level = "INFO"
addopts = ["-ra"]

# 警告を素通りさせない。**許すものは1件ずつ、直前行に理由を書いて足す。**
# **`ignore` ではなく `default`** — 握りつぶさず、警告としては出し続ける。
filterwarnings = [
    "error",
    # 隔離下では必ず出る。run-isolated がリポジトリを読み取り専用で bind
    # するので pytest がキャッシュを書けない（このリポジトリでは実測1件）。
    # 層1の設計そのものが生む警告で、テストの欠陥ではない。
    "default::pytest.PytestCacheWarning",
    # penguinEx 側と同じ許可を対で置く。**このリポジトリ単体の走行では
    # 現時点で発火していない**（実測: 許可を足した状態で 80 passed、
    # 3 warnings）が、両リポジトリの設定を同じ形に保つ。
    # 記録: penguinEx の ideas/bugs/2026-09-07-pytest-unraisable-deallocator.md
    "default::pytest.PytestUnraisableExceptionWarning",
]

# カバレッジの設定（penguinEx issue #16、テスト基盤の層2）。
# penguinEx 側の pyproject.toml と同じ構成。source だけがこのリポジトリの
# 実体（dot_claude/hooks 配下）に合わせてある。
[tool.coverage.run]
branch = true
# **データファイルをリポジトリの外へ置く。**run-isolated はリポジトリを
# 読み取り専用で bind するので、既定の <repo>/.coverage では書けない。
# 隔離の中の $HOME は書けるので、そこへ置いて --out で取り出す。
data_file = "${COVERAGE_OUT_DIR?}/.coverage"
# **テストコード自身も計測する。**実行されていないテストファイルは、
# カバレッジ0ではなく「そのファイルが一度も読み込まれていない」として
# 現れる。テストがあるのに走っていない、という状態をこれで捕まえる。
source = [
    "dot_claude/hooks",
]
omit = [
    # シェルテスト（stop-fabricated-turn-guard.bats）が
    # サブプロセスとして起動する対象で、pytest 経由のカバレッジ計測は
    # 届かない。テストが無いわけではなく、計測の手段が別（shell）にある。
    # **グロブでまとめない**（同じディレクトリへあとから置かれた .py まで
    # 黙って除外に入るため）。
    "dot_claude/hooks/executable_stop-fabricated-turn-guard.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# **これが無いと「一度も実行されていないファイル」の探索がサブディレクトリを
# 飛ばす。**coverage.py は既定で、importable なファイル（ツリーの根にあるか、
# `__init__.py` を持つディレクトリの中）しか未実行ファイルとして数えない。
# **このリポジトリに `__init__.py` は1本も無い**うえ、唯一のテストが
# `dot_claude/hooks/tests/` にあるため、これが無いと受け入れ条件8が
# 1本も効かない。
include_namespace_packages = true
