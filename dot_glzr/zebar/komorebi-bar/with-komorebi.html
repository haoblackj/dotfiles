<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Custom styles. -->
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Allows React to be run buildless via "text/babel" script below. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useEffect,
      } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        komorebi: { type: 'komorebi' },
        date: { type: 'date', formatting: 'EEE d MMM t' },
        media: { type: 'media' },
      });

      createRoot(document.getElementById('root')).render(<App />);

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        // 右クリックで出す komorebi の起動と停止のメニュー
        const [menuOpen, setMenuOpen] = useState(false);

        useEffect(() => {
          providers.onOutput(() => setOutput(providers.outputMap));
          // komorebi が止まると、プロバイダーは出力を null にして onError だけを呼ぶ。
          // onOutput だけでは止まったことに気づけない。
          providers.onError(() => setOutput(providers.outputMap));
        }, []);

        function isWorkspaceEmpty(workspace) {
          return (
            workspace.tilingContainers.length === 0 &&
            workspace.floatingWindows.length === 0
          );
        }

        function focusWorkspace(name) {
          zebar.shellExec('komorebic.exe', [
            'focus-named-workspace',
            name,
          ]);
        }

        // 起動と停止は komorebi-ctl.ps1 を通す。停止のあとに半透明を外す後始末が要る
        // （komorebi#1749）。$HOME の展開は pwsh に任せる。
        function komorebiCtl(action) {
          setMenuOpen(false);
          zebar.shellExec('pwsh.exe', [
            '-NoProfile',
            '-WindowStyle',
            'Hidden',
            '-Command',
            `& "$HOME\\.config\\komorebi\\komorebi-ctl.ps1" ${action}`,
          ]);
        }

        // フォーカス表示と絞り込みは、このバーのモニターに映っているワークスペース
        // （displayedWorkspace）で判定する。focusedWorkspace は全モニターのうちフォーカスの
        // あるものなので、別のモニターのバーで使うと、映っている空のワークスペースが消え、
        // フォーカス表示もずれる（2026-10-15、zebar 3.3.1 の create-komorebi-provider.ts）。
        const displayedName = output.komorebi?.displayedWorkspace?.name;

        const session = output.media?.currentSession;

        return (
          <div className="app">
            <div
              className="left"
              onContextMenu={e => {
                e.preventDefault();
                setMenuOpen(!menuOpen);
              }}
            >
              {menuOpen && (
                <div className="workspaces">
                  <button
                    className="workspace"
                    onClick={() => komorebiCtl('start')}
                  >
                    Komorebi 起動
                  </button>
                  <button
                    className="workspace"
                    onClick={() => komorebiCtl('stop')}
                  >
                    Komorebi 停止
                  </button>
                  {/* zebar が komorebi の通知を受けられなくなり、表示が固まったときの
                      逃げ道（komorebi-ctl.ps1 の Restart-Zebar に経緯）。 */}
                  <button
                    className="workspace"
                    onClick={() => komorebiCtl('restart-zebar')}
                  >
                    Zebar 再起動
                  </button>
                  <button
                    className="workspace"
                    onClick={() => setMenuOpen(false)}
                  >
                    ×
                  </button>
                </div>
              )}
              {!menuOpen && !output.komorebi && (
                <div className="workspaces">
                  <button
                    className="workspace"
                    onClick={() => komorebiCtl('start')}
                  >
                    Komorebi 起動
                  </button>
                </div>
              )}
              {!menuOpen && output.komorebi && (
                <div className="workspaces">
                  {output.komorebi.currentWorkspaces
                    .filter(
                      workspace =>
                        !isWorkspaceEmpty(workspace) ||
                        workspace.name === displayedName,
                    )
                    .map(workspace => (
                      <button
                        className={`workspace ${workspace.name === displayedName ? 'focused' : ''}`}
                        key={workspace.name}
                        onClick={() => focusWorkspace(workspace.name)}
                      >
                        {workspace.name}
                      </button>
                    ))}
                </div>
              )}
            </div>

            <div className="center">{output.date?.formatted}</div>

            <div className="right">
              {session && (
                <div
                  className="media"
                  onClick={() => output.media.togglePlayPause()}
                >
                  <i
                    className={
                      session.isPlaying
                        ? 'nf nf-md-pause_circle'
                        : 'nf nf-md-play_circle'
                    }
                  ></i>
                  <span className="media-title">
                    {session.title}
                    {session.artist && ` - ${session.artist}`}
                  </span>
                </div>
              )}
            </div>
          </div>
        );
      }
    </script>
  </body>
</html>
