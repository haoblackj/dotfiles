# Claude Code の一時ディレクトリ（CLAUDE_CODE_TMPDIR、~/.claude/settings.json の env）の掃除。
# /tmp は WSL の再起動で消えるので外へ移した（2026-10-23）。Claude Code 自身は scratchpad を
# transcript と同時に消すが、cleanupPeriodDays を 36500 にしているので実質消えない。
# 180 日だれも触らなかったものを消す。実行は systemd-tmpfiles-clean.timer（--user）が日に一度。
d %h/.cache/cc-tmp 0700 - - 180d
