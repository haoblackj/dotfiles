[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = false
consent_given = false
consent_date = "2026-06-21T08:54:45.277418755+00:00"

[hooks]
# git を除外する理由: EnterWorktree 中のセッションでは、rtk が git を `rtk git` に
# 書き換えると Claude Code のワークツリー guard が「git を実行しないと示せない」と
# して全 git を拒否する（2026-09-14 実測）。代償として git 出力の圧縮は効かない。
exclude_commands = ["git"]
transparent_prefixes = []

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000
