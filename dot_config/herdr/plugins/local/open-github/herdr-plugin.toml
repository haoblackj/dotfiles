id = "local.open-github"
name = "Open GitHub"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "フォーカス中ペインのブランチの issue と PR を fzf のオーバーレイで選び、ブラウザで開く。"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open issue / PR of current branch"
contexts = ["workspace"]
command = ["bash", "open.sh"]

# popup は画面を割らずに浮く一時ペイン（overlay はズームした全画面になる）。
# 寸法はセル数か割合。候補は最大2行なので高さは小さくてよい。
[[panes]]
id = "picker"
title = "Open GitHub"
placement = "popup"
width = "80%"
height = 10
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/picker.sh\""]
