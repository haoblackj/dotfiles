id = "local.open-project"
name = "Open Project"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "fzfで ~/repo/github.com/haoblackj/ 配下のプロジェクトを選び、新規workspaceでClaude Codeを起動する。"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open project (new workspace)"
contexts = ["workspace"]
command = ["bash", "open.sh"]

[[panes]]
id = "picker"
title = "Open Project"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/picker.sh\""]
