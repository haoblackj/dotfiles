default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      # Python のテスト。bwrap の隔離（run-isolated）は 2026-09-13 に撤去した。
      # pre-commit 自身の venv に pytest を入れる（language: python）。PATH 先頭の
      # python3 に依存しない（uvx 経由だと uv の python が先に来て pytest が無い。実測）。
      - id: pytest
        name: pytest
        language: python
        additional_dependencies: ["pytest==9.0.3"]
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: pytest -p no:cacheprovider
      # 追跡された .bats をソースツリーで走らせる。bats を直接呼ぶ
      # （自作の run-bats-gate は 2026-09-13 に撤去）。
      - id: bats
        name: bats
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: >-
          bash -c 'cd "$(git rev-parse --show-toplevel)" && bats -r .'
      - id: check-coverage-sources
        name: check-coverage-sources
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: >-
          bash -c 'command -v check-coverage-sources.sh >/dev/null 2>&1 ||
          { echo "check-coverage-sources.sh が PATH にありません"; exit 1; };
          check-coverage-sources.sh "$(git rev-parse --show-toplevel)"'
      - id: list-untested-shell
        name: list-untested-shell
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: >-
          bash -c 'command -v list-untested-shell.sh >/dev/null 2>&1 ||
          { echo "list-untested-shell.sh が PATH にありません。道具が無いので一覧を確認できませんでした（一覧が空だったのではない）"; exit 1; };
          list-untested-shell.sh "$(git rev-parse --show-toplevel)" "$HOME/repo/github.com/haoblackj/penguinEx"'
      # ShellCheck の除外規則 -e SC2015,SC2016,SC2030,SC2031 の理由
      # （両リポジトリで同一内容。自己完結させるため）。
      # SC2015（`A && B || C` は if-then-else ではない）:
      #   多数のファイルに散る自己点検スクリプトの慣用句。呼ばれる報告関数は
      #   echo のみで、B が失敗して C が誤発火する経路が構造的に無い。
      # SC2016（シングルクォート内は展開されない）:
      #   多数のファイルに散る。別シェルへ渡す文字列と、grep/awk のパターン。
      #   このシェルで展開してはいけないことが意図。
      # SC2030 / SC2031（サブシェル内の変更はローカルに留まる）:
      #   `.bats` の `@test` がサブシェルとして扱われることに由来。bats が
      #   各テストを隔離するのは設計どおりで、今後書く `.bats` に構造上
      #   必ず出る。
      - id: shellcheck
        name: shellcheck
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: >-
          bash -c 'set -o pipefail;
          command -v shellcheck >/dev/null 2>&1 ||
          { echo "shellcheck が PATH にありません"; exit 1; };
          cd "$(git rev-parse --show-toplevel)" || exit 1;
          git ls-files -z "*.sh" "*.bats" |
          xargs -0 -r shellcheck -P SCRIPTDIR -e SC2015,SC2016,SC2030,SC2031'
  # pytest の設定検査（PP3xx）。公式の sp-repo-review フックを ID 指定で絞る
  # （--select は完全一致か族名で、PP3 の接頭辞では効かない。2026-09-13 実測）。
  # 自作の check-pytest-gate は同日に撤去。
  - repo: https://github.com/scientific-python/cookie
    rev: 2026.08.14
    hooks:
      - id: sp-repo-review
        stages: [pre-push]
        args: [--select, "PP301,PP302,PP303,PP304,PP305,PP306,PP307,PP308,PP309", --show=err]
