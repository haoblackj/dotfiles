default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      # Python のテストは run-isolated（bwrap で HOME を差し替え、本番資産の
      # mtime 差分を見る）の中で走らせる。素の pytest は PreToolUse フック
      # guard-unsandboxed-pytest.sh が止める。
      - id: pytest-isolated
        name: pytest (run-isolated)
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: >-
          bash -c 'command -v run-isolated.sh >/dev/null 2>&1 ||
          { echo "run-isolated.sh が PATH にありません。道具が無いので門を通せません"; exit 1; };
          run-isolated.sh "$(git rev-parse --show-toplevel)" -- python3 -m pytest
          -p no:cacheprovider'
      # 追跡された .bats を全部ソースツリーで走らせる。bats は隔離の外で
      # 構わない（層4a・4b の運用）。道具が無い・対象0本なら非0で落ちる。
      - id: bats-gate
        name: bats (run-bats-gate)
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: >-
          bash -c 'command -v run-bats-gate.sh >/dev/null 2>&1 ||
          { echo "run-bats-gate.sh が PATH にありません。道具が無いので門を通せません"; exit 1; };
          run-bats-gate.sh "$(git rev-parse --show-toplevel)"'
      - id: check-coverage-sources
        name: check-coverage-sources
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: >-
          bash -c 'command -v check-coverage-sources.sh >/dev/null 2>&1 ||
          { echo "check-coverage-sources.sh が PATH にありません"; exit 1; };
          check-coverage-sources.sh "$(git rev-parse --show-toplevel)"'
      - id: list-untested-shell
        name: list-untested-shell
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: >-
          bash -c 'command -v list-untested-shell.sh >/dev/null 2>&1 ||
          { echo "list-untested-shell.sh が PATH にありません。道具が無いので一覧を確認できませんでした（一覧が空だったのではない）"; exit 1; };
          list-untested-shell.sh "$(git rev-parse --show-toplevel)" "$HOME/repo/github.com/haoblackj/penguinEx"'
      - id: check-pytest-gate
        name: check-pytest-gate
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: >-
          bash -c 'command -v check-pytest-gate.sh >/dev/null 2>&1 ||
          { echo "check-pytest-gate.sh が PATH にありません"; exit 1; };
          check-pytest-gate.sh "$(git rev-parse --show-toplevel)"'
      # ShellCheck の除外規則 -e SC2015,SC2016,SC2030,SC2031 の理由
      # （両リポジトリで同一内容。自己完結させるため）。
      # SC2015（`A && B || C` は if-then-else ではない）:
      #   多数のファイルに散る自己点検スクリプトの慣用句。呼ばれる報告関数は
      #   echo のみで、B が失敗して C が誤発火する経路が構造的に無い。
      # SC2016（シングルクォート内は展開されない）:
      #   多数のファイルに散る。別シェルへ渡す文字列と、grep/awk のパターン。
      #   このシェルで展開してはいけないことが意図。
      # SC2030 / SC2031（サブシェル内の変更はローカルに留まる）:
      #   `.bats` の `@test` がサブシェルとして扱われることに由来。bats が
      #   各テストを隔離するのは設計どおりで、今後書く `.bats` に構造上
      #   必ず出る。
      - id: shellcheck
        name: shellcheck
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
        verbose: true
        entry: >-
          bash -c 'set -o pipefail;
          command -v shellcheck >/dev/null 2>&1 ||
          { echo "shellcheck が PATH にありません"; exit 1; };
          cd "$(git rev-parse --show-toplevel)" || exit 1;
          git ls-files -z "*.sh" "*.bats" |
          xargs -0 -r shellcheck -P SCRIPTDIR -e SC2015,SC2016,SC2030,SC2031'
